<section class="contact section">
  <div class="section-inner">
    <div class="contact-wrap">
      <div class="contact-left" reveal revealDirection="left">
        <p class="section-num">03 — Contact</p>
        <h2 class="section-title">Let's build<br />something great</h2>
        <p class="section-desc">
          Open to freelance, full-time roles, and collaborations.
          Drop a message — I typically respond within 24 hours.
        </p>

        <div class="contact-details">
          <a href="mailto:contactwithali.asghar@gmail.com" class="contact-item">
            <span class="contact-item-label">Email</span>
            <span class="contact-item-value">contactwithali.asghar@gmail.com</span>
          </a>
          <a href="tel:+923042488127" class="contact-item">
            <span class="contact-item-label">Phone</span>
            <span class="contact-item-value">+92 304 248 8127</span>
          </a>
          <div class="contact-item">
            <span class="contact-item-label">Location</span>
            <span class="contact-item-value">Lahore, Pakistan</span>
          </div>
        </div>

        <div class="contact-socials">
          <a href="https://www.linkedin.com/in/alixh2547" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="https://github.com/itsAliXH" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>

      <form class="contact-form" reveal revealDirection="right" [revealDelay]="120" (submit)="sendEmail($event)">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="from_name" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="reply_to" placeholder="you@email.com" required />
          </div>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Project inquiry" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Tell me about your project..." required></textarea>
        </div>
        <button type="submit" class="btn btn-accent submit-btn">
          Send message
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>
</section>
