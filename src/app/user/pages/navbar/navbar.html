<header class="nav-wrap" [class.scrolled]="isScrolled" [class.menu-open]="isMenuOpen">
  <div class="nav-shell">
    <a class="nav-brand" role="button" tabindex="0" (click)="scrollTo('home')">
      <span class="nav-brand-dot"></span>
      Ali<span class="nav-brand-accent">.</span>
    </a>

    <button
      class="nav-burger"
      (click)="toggleMenu()"
      [class.active]="isMenuOpen"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="nav-menu"
      aria-label="Menu"
    >
      <span></span>
      <span></span>
    </button>

    <ul id="nav-menu" class="nav-menu nav-menu--desktop">
      <li>
        <a role="button" tabindex="0" [class.active]="isActive('home')" (click)="scrollTo('home')">
          Home
        </a>
      </li>
      <li>
        <a role="button" tabindex="0" [class.active]="isActive('about')" (click)="scrollTo('about')">
          About
        </a>
      </li>
      <li>
        <a role="button" tabindex="0" [class.active]="isActive('projects')" (click)="scrollTo('projects')">
          Work
        </a>
      </li>
      <li>
        <a role="button" tabindex="0" [class.active]="isActive('contact')" (click)="scrollTo('contact')">
          Contact
        </a>
      </li>
    </ul>
  </div>

  <!-- Full-screen overlay — outside nav-shell so fixed positioning is not trapped by backdrop-filter -->
  <ul
    class="nav-menu nav-menu--mobile"
    [class.open]="isMenuOpen"
    [attr.aria-hidden]="!isMenuOpen"
  >
    <li>
      <a role="button" tabindex="0" [class.active]="isActive('home')" (click)="scrollTo('home')">Home</a>
    </li>
    <li>
      <a role="button" tabindex="0" [class.active]="isActive('about')" (click)="scrollTo('about')">About</a>
    </li>
    <li>
      <a role="button" tabindex="0" [class.active]="isActive('projects')" (click)="scrollTo('projects')">Work</a>
    </li>
    <li>
      <a role="button" tabindex="0" [class.active]="isActive('contact')" (click)="scrollTo('contact')">Contact</a>
    </li>
  </ul>
</header>
